name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadflow
          POSTGRES_PASSWORD: leadflow
          POSTGRES_DB: leadflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leadflow -d leadflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Required by app settings at import time; the tests themselves use TEST_DATABASE_URL.
      DATABASE_URL: postgresql+psycopg://leadflow:leadflow@localhost:5432/leadflow
      CORS_ORIGINS: http://localhost:3000
      TEST_DATABASE_URL: postgresql+psycopg://leadflow:leadflow@localhost:5432/leadflow_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  frontend:
    name: Frontend (lint, types, format, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Dummy value: the build only needs a well-formed URL to inline.
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # A fresh checkout has no generated route types (e.g. LayoutProps) yet.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run format:check
      - run: npm test
      - run: npm run build
